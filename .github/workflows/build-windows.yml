name: Build Mooni Analyzer (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the installer to a GitHub Release on tag pushes

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMOONI_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --config Release --target MooniTests --parallel

      - name: Run DSP / analysis tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter MooniTests.exe | Select-Object -First 1
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target MooniAnalyzer_VST3 MooniAnalyzer_Standalone --parallel

      - name: Check build output
        shell: pwsh
        run: |
          $vst = "build/MooniAnalyzer_artefacts/Release/VST3/Mooni Analyzer.vst3"
          $dll = "$vst/Contents/x86_64-win/Mooni Analyzer.vst3"
          if (-not (Test-Path $dll)) { throw "VST3 binary missing: $dll" }
          Get-ChildItem -Recurse $vst | Format-Table FullName, Length
          if (-not (Test-Path "build/MooniAnalyzer_artefacts/Release/Standalone/Mooni Analyzer.exe")) { throw "Standalone missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DBuildDir=$PWD\build\MooniAnalyzer_artefacts\Release" "/O$PWD\dist" installer\MooniAnalyzer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Zip portable VST3
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path "build/MooniAnalyzer_artefacts/Release/VST3/Mooni Analyzer.vst3" -DestinationPath "dist/MooniAnalyzer-$version-VST3-portable.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MooniAnalyzer-Windows
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
